<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stream Control</title>
<link rel="icon" href="data:,">
<style>
/* Jost (SIL Open Font License), latin subset, served by the app so the page needs no internet. */
@font-face {
  font-family: "Jost";
  font-style: normal;
  font-weight: 100 900;
  font-display: swap;
  src: url(/jost.woff2) format("woff2");
}

/* ---- tokens: every colour defined once ---- */
:root {
  --ground: #F7F6F2;      /* paper */
  --ink: #141414;         /* text, rules, plain buttons, mark outlines */
  --muted: #5F5D58;       /* secondary text, column labels */
  --rule: #CFCCC4;        /* hairlines */
  --box: #ECEAE3;         /* monospace boxes */
  --blue: #1D4ED8;        /* running; focus */
  --blue-fill: #1D4ED8;   /* primary action fill */
  --red: #C8201A;         /* failed; error text */
  --red-fill: #C8201A;    /* irreversible action fill */
  --yellow: #F2B705;      /* waiting, stale, unsaved: attention */
  --on-fill: #FFFFFF;
  --on-yellow: #141414;
  --sans: "Jost", "Futura", "Avenir Next", "Century Gothic", "URW Gothic", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ground: #121212;
    --ink: #ECEAE4;
    --muted: #A09D96;
    --rule: #3A3936;
    --box: #1D1C1A;
    --blue: #7A9CFF;
    --blue-fill: #2F5FE0;
    --red: #FF6B5E;
    --red-fill: #D7281F;
    --yellow: #F2B705;
    --on-fill: #FFFFFF;
    --on-yellow: #121212;
    color-scheme: dark;
  }
}

/* ---- base ---- */
* { box-sizing: border-box; }
html { background: var(--ground); }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font: 400 15px/24px var(--sans);
}
h1, h2, h3, p, dl, dd, dt, figure, pre, fieldset { margin: 0; }
fieldset { border: 0; padding: 0; min-width: 0; }
legend { padding: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
[hidden] { display: none !important; }
.muted { color: var(--muted); }

/* ---- page grid: 8 px baseline, max 1440 ---- */
.page {
  max-width: 1440px;
  margin: 0 auto;
  padding: 24px 40px 40px;
}
@media (max-width: 999px) { .page { padding: 16px 24px 32px; } }
@media (max-width: 599px) { .page { padding: 16px 16px 32px; } }

/* header: title left, counts right, action rule beneath */
.head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px 24px;
  padding-bottom: 16px;
  border-bottom: 3px solid var(--ink);
}
.head h1 { font-size: 32px; line-height: 40px; font-weight: 500; letter-spacing: -0.01em; }
.counts { font-size: 18px; line-height: 24px; }
.counts b { font-weight: 700; }
.counts .live { color: var(--blue); }

.notice {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 16px;
  padding: 8px 16px;
  background: var(--yellow);
  color: var(--on-yellow);
  font-weight: 500;
}
.notice .mark { fill: var(--on-yellow); stroke: var(--on-yellow); }

.bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  padding: 16px 0;
  border-bottom: 1px solid var(--rule);
}
.bar .spacer { flex: 1 1 auto; }
.bar .message { flex-basis: 100%; }
@media (max-width: 599px) {
  .bar { display: grid; grid-template-columns: 1fr 1fr; }
  .bar .spacer { display: none; }
  .bar .message { grid-column: 1 / -1; }
}

/* list and panel side by side from 1280 px: the list takes what the panel leaves */
.body { display: grid; grid-template-columns: minmax(0, 1fr); gap: 32px 48px; padding-top: 24px; }
@media (min-width: 1280px) {
  .body { grid-template-columns: minmax(0, 1fr) 460px; align-items: start; }
}

/* ---- marks: circle = process, square = error, triangle = blocked;
        filled = steady, hollow = changing. Yellow marks carry an ink outline. ---- */
.mark { display: inline-block; width: 12px; height: 12px; vertical-align: -1px; flex: none; overflow: visible; }
.mark.blue { fill: var(--blue); stroke: var(--blue); }
.mark.red { fill: var(--red); stroke: var(--red); }
.mark.grey { fill: var(--muted); stroke: var(--muted); }
.mark.yellow { fill: var(--yellow); stroke: var(--ink); stroke-width: 1.25; }
.mark.hollow { fill: none; stroke-width: 2; }
.state { font-weight: 500; }
.state.is-running { color: var(--blue); }
.state.is-failed { color: var(--red); }

/* ---- controls: plain rectangles ---- */
button {
  font-weight: 500;
  background: transparent;
  color: var(--ink);
  border: 2px solid var(--ink);
  border-radius: 0;
  padding: 4px 14px;
  min-height: 36px;
  cursor: pointer;
}
button.primary { background: var(--blue-fill); border-color: var(--blue-fill); color: var(--on-fill); }
button.danger  { background: var(--red-fill);  border-color: var(--red-fill);  color: var(--on-fill); }
button:disabled { color: var(--muted); border-color: var(--rule); background: transparent; cursor: default; }
button.copy { min-width: 84px; }
@media (max-width: 999px) { button { min-height: 40px; } }

input[type="text"], input[type="number"], select {
  background: var(--ground);
  border: 2px solid var(--ink);
  border-radius: 0;
  padding: 4px 10px;
  min-height: 36px;
  width: 100%;
}
input[type="radio"] { accent-color: var(--blue-fill); width: 18px; height: 18px; margin: 0 8px 0 0; vertical-align: -3px; }
input:disabled, select:disabled { color: var(--muted); border-color: var(--rule); }
@media (max-width: 999px) { input[type="text"], input[type="number"], select { min-height: 40px; } }

.message { font-family: var(--mono); font-size: 13px; line-height: 20px; color: var(--red); }
.message:empty { display: none; }

/* ---- list ---- */
.list { width: 100%; border-collapse: collapse; }
.list th {
  text-align: left;
  font-size: 13px; line-height: 16px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 0 12px 8px 0;
  border-bottom: 2px solid var(--ink);
  white-space: nowrap;
}
.list td { padding: 8px 12px 8px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
.list th.c-port, .list td.c-port { text-align: right; font-variant-numeric: tabular-nums; }
.list tr { cursor: pointer; }
.list tr.selected td.c-name { box-shadow: inset 6px 0 0 var(--ink); }
.list td.c-name { padding-left: 16px; white-space: nowrap; }
.list tr.selected .rowname { font-weight: 700; }
.rowname {
  display: inline-flex; align-items: center; gap: 10px;
  border: 0; padding: 0; min-height: 24px;
  font-weight: 500; background: transparent; text-align: left;
}
.rowname:focus-visible { outline-offset: 4px; }
.list td.c-transport, .list td.c-file, .list td.c-port { white-space: nowrap; }
.list th.c-state, .list td.c-state { padding-left: 12px; padding-right: 0; }
.list td.c-state .reason { display: block; font-size: 13px; line-height: 20px; color: var(--muted); }
.list td.c-state .reason:empty { display: none; }
.empty { padding: 16px 0 0 16px; color: var(--muted); }

@media (max-width: 719px) {
  .list thead { display: none; }
  .list, .list tbody { display: block; }
  .list tr {
    display: grid;
    grid-template-columns: auto auto 1fr auto;
    grid-template-areas:
      "name name name state"
      "transport file port port"
      "reason reason reason reason";
    align-items: baseline;
    column-gap: 12px;
    padding: 8px 0 8px 16px;
    border-bottom: 1px solid var(--rule);
  }
  .list tr.selected { box-shadow: inset 6px 0 0 var(--ink); }
  .list tr.selected td.c-name { box-shadow: none; }
  .list td { display: block; padding: 0; border: 0; }
  .list td.c-name { grid-area: name; padding-left: 0; }
  .list td.c-state { display: contents; }
  .list td.c-state .state { grid-area: state; justify-self: end; }
  .list td.c-state .reason { grid-area: reason; }
  .list td.c-transport { grid-area: transport; }
  .list td.c-file { grid-area: file; }
  .list td.c-port { grid-area: port; text-align: left; }
  .list td.c-transport, .list td.c-file, .list td.c-port { font-size: 13px; line-height: 20px; color: var(--muted); }
  .rowname { min-height: 40px; }
}

/* ---- panel ---- */
.panel { min-width: 0; }
.panel h2 { font-size: 24px; line-height: 32px; font-weight: 500; overflow-wrap: anywhere; }
.staterow {
  display: flex; flex-wrap: wrap; align-items: center;
  gap: 8px 16px;
  margin-top: 16px;
  padding: 12px 0;
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
}
.staterow .stateword { display: inline-flex; align-items: center; gap: 10px; font-size: 18px; }
.staterow .reason { color: var(--muted); }
.staterow .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.staterow .message { flex-basis: 100%; }
@media (max-width: 599px) {
  .staterow .actions { margin-left: 0; flex-basis: 100%; display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); }
}

.errorblock { margin-top: 12px; border-left: 4px solid var(--red); padding-left: 12px; }
.errorblock .label { color: var(--red); }
.errorblock pre { margin-top: 4px; }

.label {
  font-size: 13px; line-height: 16px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}
.section { margin-top: 24px; }

.line { display: flex; align-items: flex-start; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--rule); }
.line .url { flex: 1 1 auto; min-width: 0; font-family: var(--sans); font-size: 16px; line-height: 24px; overflow-wrap: anywhere; }
.line .sub { display: block; font-family: var(--sans); font-size: 13px; line-height: 16px; color: var(--muted); }

pre {
  font-family: var(--mono);
  font-size: 13px; line-height: 20px;
  background: var(--box);
  padding: 12px 16px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  max-height: 320px;
  overflow: auto;
}

/* facts: label column + value */
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 4px 24px; }
.facts dt { color: var(--muted); }
.facts dd { overflow-wrap: anywhere; }
.facts .how { color: var(--muted); }
.facts .instead { display: block; color: var(--muted); }

/* forms: columns only when each is wide enough for the longest transport label */
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px 32px; padding-top: 16px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field > label, .field > legend { font-weight: 500; }
.field > legend + .radios { margin-top: 4px; }
.note { color: var(--muted); display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; min-height: 24px; }
.note b { color: var(--ink); font-weight: 500; }
.form > .note.wide { grid-column: 1 / -1; margin-top: -8px; }
.field .radios { display: flex; gap: 24px; min-height: 36px; align-items: center; flex-wrap: wrap; }
.field .radios label { display: inline-flex; align-items: center; min-height: 36px; }
.field .static { min-height: 36px; display: flex; align-items: center; color: var(--muted); }
@media (max-width: 999px) { .field .radios, .field .radios label, .field .static { min-height: 40px; } }
.warn { display: inline-flex; align-items: center; gap: 8px; }

.formactions { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-top: 8px; }
.formactions .draft { display: inline-flex; align-items: center; gap: 8px; margin-left: auto; font-weight: 500; }
.formactions .message { flex-basis: 100%; }
@media (max-width: 599px) {
  .formactions { display: grid; grid-template-columns: 1fr 1fr; }
  .formactions.stacked { grid-template-columns: 1fr; }
  .formactions .draft { grid-column: 1 / -1; order: -1; margin-left: 0; }
  .formactions .message { grid-column: 1 / -1; }
}

/* notebook: one tab at a time, the active one carried by a 3 px rule */
.notebook { grid-column: 1 / -1; padding-top: 8px; }
.tabs { display: flex; flex-wrap: wrap; gap: 0 8px; border-bottom: 1px solid var(--rule); }
.tabs [role="tab"] {
  border: 0; border-bottom: 3px solid transparent; margin-bottom: -1px;
  padding: 8px 12px; min-height: 40px;
  color: var(--muted); font-weight: 500;
}
.tabs [role="tab"]:first-child { padding-left: 0; }
.tabs [role="tab"][aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.tabs [role="tab"]:focus-visible { outline-offset: -3px; }
@media (max-width: 599px) {
  .tabs { gap: 0; justify-content: space-between; }
  .tabs [role="tab"] { padding: 8px 6px; }
  .tabs [role="tab"]:last-child { padding-right: 0; }
}
.tabpanel { padding-top: 16px; }
.tabpanel .form { padding-top: 0; }
.tabpanel pre { margin: 0; }

/* create form: advanced choices behind a disclosure */
details.advanced { grid-column: 1 / -1; }
details.advanced > summary { cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 10px; min-height: 40px; font-weight: 500; }
details.advanced > summary::-webkit-details-marker { display: none; }
details.advanced > summary .tri { width: 0; height: 0; border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-left: 10px solid var(--ink); }
details.advanced[open] > summary .tri { transform: rotate(90deg); }
details.advanced .form { padding-top: 8px; }

.settings h2 { padding-bottom: 8px; }
.settings .rule { color: var(--muted); }
.settings > .form { padding-top: 24px; }
.settings .tabpanel > .rule { padding-bottom: 16px; }
.field .purpose { color: var(--muted); font-weight: 400; }
.hostchoices { display: flex; flex-wrap: wrap; gap: 8px 16px; padding-top: 4px; }
.hostchoices > span { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hostchoices .purpose { overflow-wrap: anywhere; }
</style>
</head>
<body>
<div class="page">
  <header class="head">
    <h1>Stream Control</h1>
    <p class="counts" id="counts" aria-live="polite"></p>
  </header>

  <div class="notice" id="notice" role="status" hidden>
    <svg class="mark" viewBox="0 0 12 12" aria-hidden="true"><polygon points="6,0.8 11.4,11 0.6,11"/></svg>
    <span id="noticeText"></span>
  </div>

  <div class="bar">
    <button type="button" data-act="start-all">Start all</button>
    <button type="button" data-act="stop-all">Stop all</button>
    <span class="spacer"></span>
    <button type="button" data-act="new">New stream</button>
    <button type="button" data-act="settings">Settings</button>
    <p class="message" id="barMessage" role="alert"></p>
  </div>

  <div class="body">
    <section aria-label="Streams">
      <table class="list" id="list">
        <thead>
          <tr>
            <th class="c-name">Name</th>
            <th class="c-transport">Transport</th>
            <th class="c-file">File</th>
            <th class="c-port">Port</th>
            <th class="c-state">State</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <p class="empty" id="empty" hidden>No streams yet.</p>
    </section>

    <section class="panel" id="panel"></section>
  </div>
</div>

<script>
const POLL_MS = 5000;
const STALE_MS = 12000;

const state = {
  streams: [],
  transports: [],
  settings: {},
  hostAddresses: { hostname: "", lan_ip: "" },
  videos: [],
  loaded: false,                         // the first poll has answered
  panel: { mode: "settings", name: null }, // none | stream | create | settings
  tab: "source",                         // notebook tab in the stream detail
  settingsTab: "general",
  drafts: new Map(),                     // stream name -> edit draft; a map because drafts are sparse and keyed by stream identity
  createDraft: null,
  nameTouched: false,
  settingsDraft: null,
  deleteArmed: null,
  messages: new Map(),                   // target key ("all", "stream:<name>", "edit:<name>", "create", "settings") -> server text
  lastOk: null,
  unreachable: false,
};

/* ---------- formatting (pure) ---------- */
function formatRate(value) {
  if (value == null) return "";
  return Number.isInteger(value) ? String(value) : value.toFixed(2);
}
function formatLoop(count) {
  if (count === -1) return "forever";
  if (count === 0) return "once";
  return "count " + count;
}
function formatPort(port) {
  return port == null ? "—" : String(port);
}
/* A reason that only repeats the state word ("stopped", "starting") adds nothing. */
function reasonText(stream) {
  return stream.reason && stream.reason !== stream.state ? stream.reason : "";
}
function transportOf(id) {
  return state.transports.find((kind) => kind.id === id);
}
function streamByName(name) {
  return state.streams.find((stream) => stream.name === name);
}
function settingLabel(key) {
  return SETTING_FIELDS.find((field) => field.key === key).label;
}
function fileStem(filename) {
  return filename.replace(/\.[^.]+$/, "");
}
function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}

/* ---------- state marks ----------
   Shape is the category: circle = a process, square = an error, triangle = blocked.
   Colour: blue delivering, grey inert, red error, yellow blocked.
   Filled = steady, hollow = changing. */
const MARKS = {
  running:    { shape: "circle", colour: "blue" },
  starting:   { shape: "circle", colour: "blue", hollow: true },
  stopping:   { shape: "circle", colour: "grey", hollow: true },
  stopped:    { shape: "circle", colour: "grey" },
  completed:  { shape: "circle", colour: "grey" },
  waiting:    { shape: "triangle", colour: "yellow" },
  restarting: { shape: "square", colour: "red", hollow: true },
  crashing:   { shape: "square", colour: "red", hollow: true },
  failed:     { shape: "square", colour: "red" },
};
const SHAPES = {
  circle: '<circle cx="6" cy="6" r="5"/>',
  square: '<rect x="1" y="1" width="10" height="10"/>',
  triangle: '<polygon points="6,0.8 11.4,11 0.6,11"/>',
};
function shapeHtml(shape, colour, hollow) {
  return `<svg class="mark ${colour}${hollow ? " hollow" : ""}" viewBox="0 0 12 12" aria-hidden="true">${SHAPES[shape]}</svg>`;
}
function markHtml(stateName) {
  const mark = MARKS[stateName] || MARKS.stopped;
  return shapeHtml(mark.shape, mark.colour, mark.hollow);
}

/* ---------- port prediction (pure) ---------- */
function predictPort(transportId, excludeName) {
  const kind = transportOf(transportId);
  if (!kind) return "";
  if (kind.random_port) return "random";
  if (!kind.first_port_setting) return "none";
  const used = new Set(state.streams.filter((s) => s.name !== excludeName && s.port != null).map((s) => s.port));
  let port = Number(state.settings[kind.first_port_setting]);
  while (used.has(port)) port += 1;
  return String(port);
}
function unsetNeeds(transportId) {
  const kind = transportOf(transportId);
  if (!kind) return [];
  return kind.needs.filter((key) => !String(state.settings[key] ?? "").trim());
}
function portNoteHtml(transportId, excludeName) {
  const port = predictPort(transportId, excludeName);
  const needs = unsetNeeds(transportId).map(settingLabel);
  const needText = needs.length
    ? `<span class="warn">${shapeHtml("triangle", "yellow")}needs ${escapeHtml(needs.join(" and "))}, unset</span>`
    : "";
  return `<span>Port it would take: <b>${port}</b></span>${needText}`;
}

/* ---------- edit drafts (pure) ---------- */
function draftFromStream(stream) {
  return {
    name: stream.name,
    file: stream.filename,
    transport: stream.transport,
    mode: stream.mode,
    frame_rate: stream.frame_rate_explicit ? formatRate(stream.frame_rate) : "auto",
    gop: stream.gop_explicit ? String(stream.gop_frames) : "auto",
    loop: stream.loop_count === -1 ? "forever" : stream.loop_count === 0 ? "once" : "count",
    loop_count: stream.loop_count > 0 ? String(stream.loop_count) : "",
  };
}
function sameDraft(left, right) {
  return Object.keys(left).every((key) => left[key] === right[key]);
}
function readForm(form) {
  const data = new FormData(form);
  return {
    name: data.get("name") ?? "",
    file: data.get("file") ?? "",
    transport: data.get("transport") ?? "",
    mode: data.get("mode") ?? "",
    frame_rate: data.get("frame_rate") ?? "",
    gop: data.get("gop") ?? "",
    loop: data.get("loop") ?? "",
    loop_count: data.get("loop_count") ?? "",
  };
}
/* The query the API takes for a draft's choices; a blank frame rate or GOP means auto. */
function choiceQuery(draft) {
  const loop = draft.loop === "forever" ? "-1" : draft.loop === "once" ? "0" : draft.loop_count;
  return { mode: draft.mode, fps: draft.frame_rate.trim() || "auto", gop: draft.gop.trim() || "auto", loop };
}

/* ---------- settings ---------- */
const SETTING_FIELDS = [
  { key: "destination_host", label: "Destination host", purpose: "where push transports send", type: "text" },
  { key: "multicast_group", label: "Multicast group", purpose: "address multicast streams send to", type: "text" },
  { key: "advertised_host", label: "Advertised host", purpose: "host written into playback URLs", type: "text" },
  { key: "max_video_bitrate", label: "Bitrate cap", purpose: "video bitrate limit when transcoding", type: "text" },
  { key: "srtp_key", label: "SRTP key", purpose: "encryption key SRTP streams use", type: "text" },
  { key: "udp_first_port", label: "UDP first port", purpose: "", type: "number" },
  { key: "rtp_first_port", label: "RTP first port", purpose: "", type: "number" },
  { key: "srt_call_first_port", label: "SRT call first port", purpose: "", type: "number" },
  { key: "srtp_first_port", label: "SRTP first port", purpose: "", type: "number" },
  { key: "srt_listen_first_port", label: "SRT listen first port", purpose: "", type: "number" },
  { key: "tcp_first_port", label: "TCP first port", purpose: "", type: "number" },

/* ---------- header, notice ---------- */
function renderCounts() {
  const node = document.getElementById("counts");
  if (!state.loaded) { setHtml(node, ""); return; }
  const total = state.streams.length;
  const running = state.streams.filter((s) => s.state === "running").length;
  setHtml(node, `<b>${total}</b> streams, <b class="live">${running}</b> running`);
}
function renderNotice() {
  const node = document.getElementById("notice");
  const text = document.getElementById("noticeText");
  if (state.lastOk === null) {
    node.hidden = !state.unreachable;
    setText(text, "Server unreachable; nothing loaded yet.");
    return;
  }
  const age = Math.round((Date.now() - state.lastOk) / 1000);
  if (age * 1000 <= STALE_MS) { node.hidden = true; return; }
  setText(text, state.unreachable
    ? `Stale: server unreachable, showing the last known state from ${age} s ago.`
    : `Stale: no update for ${age} s.`);
  node.hidden = false;
}
function renderMessage(node, key) {
  setText(node, state.messages.get(key) || "");
}
function setText(node, text) {
  if (node && node.textContent !== text) node.textContent = text;
}
function setHtml(node, html) {
  if (node && node.innerHTML !== html) node.innerHTML = html;
}

/* ---------- list: rows reconciled by name, cells patched in place ---------- */
function renderList() {
  const body = document.getElementById("rows");
  const rows = new Map([...body.children].map((tr) => [tr.dataset.name, tr]));
  state.streams.forEach((stream, index) => {
    let tr = rows.get(stream.name);
    if (!tr) {
      tr = document.createElement("tr");
      tr.dataset.name = stream.name;
      tr.innerHTML = `<td class="c-name"><button type="button" class="rowname"><span class="markslot"></span><span class="name"></span></button></td>` +
        `<td class="c-transport"></td><td class="c-file"></td><td class="c-port"></td><td class="c-state"><span class="state"></span><span class="reason"></span></td>`;
    }
    rows.delete(stream.name);
    if (body.children[index] !== tr) body.insertBefore(tr, body.children[index] || null);
    setHtml(tr.querySelector(".markslot"), markHtml(stream.state));
    setText(tr.querySelector(".name"), stream.name);
    setText(tr.querySelector(".c-transport"), stream.transport_label);
    setText(tr.querySelector(".c-file"), stream.filename);
    setText(tr.querySelector(".c-port"), formatPort(stream.port));
    const stateNode = tr.querySelector(".state");
    setText(stateNode, stream.state);
    stateNode.className = "state is-" + stream.state;
    setText(tr.querySelector(".reason"), reasonText(stream));
    const selected = state.panel.mode === "stream" && state.panel.name === stream.name;
    tr.classList.toggle("selected", selected);
    tr.querySelector(".rowname").setAttribute("aria-pressed", String(selected));
  });
  rows.forEach((tr) => tr.remove());
  document.getElementById("list").hidden = state.loaded && state.streams.length === 0;
  document.getElementById("empty").hidden = !(state.loaded && state.streams.length === 0);
}

/* ---------- panel: rebuilt when its identity changes, patched otherwise ---------- */
let renderedPanelKey = "";
function panelKey() {
  return state.panel.mode + ":" + (state.panel.name || "");
}
function renderPanel() {
  const panel = document.getElementById("panel");
  const key = panelKey();
  if (key !== renderedPanelKey) {
    renderedPanelKey = key;
    panel.innerHTML = buildPanel();
    if (state.panel.mode === "stream") fillEditForm(panel.querySelector("form"), streamByName(state.panel.name), true);
    if (state.panel.mode === "create") fillCreateForm(panel.querySelector("form"));
    if (state.panel.mode === "settings") fillSettingsForm(panel.querySelector("form"), true);
  }
  if (state.panel.mode === "stream") patchStreamPanel(panel);
  if (state.panel.mode === "create") patchCreateForm(panel.querySelector("form"));
  if (state.panel.mode === "settings") patchSettingsForm(panel.querySelector("form"));
}
function buildPanel() {
  if (state.panel.mode === "stream") return buildStreamPanel(streamByName(state.panel.name));
  if (state.panel.mode === "create") return buildCreatePanel();
  if (state.panel.mode === "settings") return buildSettingsPanel();
  return "";
}

/* Option lists follow the data: files may appear or vanish while a form is open. */

function transportOptions() {

/* Whether the output stream still carries the source's KLV: the transport must be able to carry it. */
function klvOutFact(stream) {
  if (!(stream.data_codecs || []).includes("klv")) return "none";
  return stream.carries_klv ? "passed through" : "dropped by transport";
}

/* One mode fact: what is in force, and why, only when the choice could not be honoured. */
function modeFact(stream) {
  if (stream.mode === stream.effective_mode) return { mode: stream.effective_mode, instead: "" };
  return {
    mode: stream.effective_mode,
    instead: `${stream.mode} asked for; ${stream.ineligible_codecs.join(", ")} not eligible, so ${stream.effective_mode} was used instead`,
  };
}

function patchStreamPanel(panel) {
  const stream = streamByName(state.panel.name);
  const mode = modeFact(stream);
  const facts = {
    name: stream.name,
    state: stream.state,
    reason: reasonText(stream),
    error: stream.error || "",
    delivery: stream.delivery || "—",
    video_codecs: (stream.video_codecs || []).join(", ") || "none",
    audio_codecs: (stream.audio_codecs || []).join(", ") || "none",
    klv: (stream.data_codecs || []).includes("klv") ? "present" : "none",
    source_frame_rate: formatRate(stream.source_frame_rate),
    mode: mode.mode,
    instead: mode.instead,
    encoder: stream.encoder || "—",
    frame_rate: formatRate(stream.frame_rate),
    frame_rate_how: stream.frame_rate_explicit ? "explicit" : "auto",
    gop: String(stream.gop_frames ?? "—"),
    gop_how: stream.gop_explicit ? "explicit" : "auto",
    klv_out: klvOutFact(stream),
    loop: formatLoop(stream.loop_count),
    port: formatPort(stream.port),
    command: stream.command || "—",
  };
  panel.querySelectorAll("[data-fact]").forEach((node) => setText(node, facts[node.dataset.fact]));
  panel.querySelector('[data-fact="state"]').className = "state is-" + stream.state;
  setHtml(panel.querySelector(".staterow .markslot"), markHtml(stream.state));
  panel.querySelector("[data-error]").hidden = !stream.error;
  setHtml(panel.querySelector("[data-playback]"), playbackLinesHtml(stream));

  const startBlocked = ["running", "starting", "stopping", "crashing", "restarting", "waiting"].includes(stream.state);
  const stopBlocked = ["stopped", "completed"].includes(stream.state);
  const armed = state.deleteArmed === stream.name;
  const start = panel.querySelector('[data-act="start"]');
  const stop = panel.querySelector('[data-act="stop"]');
  start.disabled = startBlocked;
  stop.disabled = stopBlocked;
  start.hidden = armed;
  stop.hidden = armed;
  panel.querySelector('[data-act="delete"]').hidden = armed;
  panel.querySelector('[data-act="delete-confirm"]').hidden = !armed;
  panel.querySelector('[data-act="delete-cancel"]').hidden = !armed;
  renderMessage(panel.querySelector(".staterow [data-message]"), "stream:" + stream.name);

  renderTabs(panel);
  const form = panel.querySelector("form");
  const draft = state.drafts.get(stream.name) || draftFromStream(stream);
  syncOptions(form.elements.file, fileOptions(draft.file));
  syncOptions(form.elements.transport, transportOptions());
  if (!state.drafts.has(stream.name)) fillEditForm(form, stream, false);
  patchEditForm(form, stream);
}

function renderTabs(panel) {
  const selected = state.panel.mode === "settings" ? state.settingsTab : state.tab;
  panel.querySelectorAll('[role="tab"]').forEach((tab) => {
    const active = tab.dataset.tab === selected;
    tab.setAttribute("aria-selected", String(active));
    tab.tabIndex = active ? 0 : -1;
    panel.querySelector("#" + tab.getAttribute("aria-controls")).hidden = !active;
  });
}

/* Set form controls from the stream unless the operator is typing in one. */
function setControl(control, value, force) {
  if (!control || (!force && document.activeElement === control)) return;
  if (control.value !== value) control.value = value;
}
function setRadio(form, name, value, force) {
  form.querySelectorAll(`input[name="${name}"]`).forEach((radio) => {
    if (!force && document.activeElement === radio) return;
    radio.checked = radio.value === value;
  });
}
function fillChoiceControls(form, draft, force) {
  setControl(form.elements.file, draft.file, force);
  setControl(form.elements.transport, draft.transport, force);
  setRadio(form, "mode", draft.mode, force);
  setControl(form.elements.frame_rate, draft.frame_rate, force);
  setControl(form.elements.gop, draft.gop, force);
  setControl(form.elements.loop, draft.loop, force);
  setControl(form.elements.loop_count, draft.loop_count, force);
}
function fillEditForm(form, stream, force) {
  const draft = state.drafts.get(stream.name) || draftFromStream(stream);
  setControl(form.elements.name, draft.name, force);
  fillChoiceControls(form, draft, force);
}
function patchEditForm(form, stream) {
  const draft = state.drafts.get(stream.name) || draftFromStream(stream);
  const hasDraft = state.drafts.has(stream.name);

  const portNote = form.querySelector("[data-port-note]");
  const transportChanged = draft.transport !== stream.transport;
  portNote.hidden = !transportChanged;
  if (transportChanged) setHtml(portNote, portNoteHtml(draft.transport, stream.name));
  form.querySelector("[data-loop-count]").hidden = draft.loop !== "count";
  const save = form.querySelector('[data-act="save"]');
  setText(save, stream.running ? "Save and restart" : "Save");
  save.disabled = !hasDraft;
  form.querySelector('[data-act="cancel"]').disabled = !hasDraft;
  form.querySelector("[data-draft]").hidden = !hasDraft;
  renderMessage(form.querySelector(".formactions [data-message]"), "edit:" + stream.name);
}
function applyModeRules(form, eligible, ineligibleCodecs, sourceRateText) {
  const passthroughRadio = form.querySelector('input[name="mode"][value="passthrough"]');
  passthroughRadio.disabled = !eligible;
  const modeNote = form.querySelector("[data-mode-note]");
  modeNote.hidden = eligible;
  if (!eligible) setText(modeNote, `Passthrough is not eligible: ${ineligibleCodecs.join(", ")} prevents it.`);
  const passthrough = form.querySelector('input[name="mode"]:checked')?.value === "passthrough";
  form.elements.frame_rate.hidden = passthrough;
  form.elements.gop.hidden = passthrough;
  const sourceRate = form.querySelector("[data-source-rate]");
  sourceRate.hidden = !passthrough;
  setText(sourceRate, sourceRateText ? `${sourceRateText}, source rate` : "source rate");
  form.querySelector("[data-gop-static]").hidden = !passthrough;
}

}
/* Focus the panel heading so the next Tab lands on its first control; scroll it into view when stacked. */
function revealPanel() {
  const heading = panelNode.querySelector("h2");
  if (!heading) return;
  heading.focus({ preventScroll: true });
  if (!window.matchMedia("(min-width: 1280px)").matches) panelNode.scrollIntoView({ block: "start" });
}

/* ---------- the server ---------- */
async function fetchJson(path) {
  const response = await fetch(path, { cache: "no-store" });
  const body = await response.json();
  if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);
  return body;
}
async function poll() {
  try {
    const [streams, videos, settings, transports, hostAddresses] = await Promise.all([
      fetchJson("/api/streams"), fetchJson("/api/videos"), fetchJson("/api/settings"),
      state.transports.length ? state.transports : fetchJson("/api/transports"),
      fetchJson("/api/host").catch(() => ({ hostname: "", lan_ip: "" })),
    ]);
    state.streams = streams;
    state.videos = videos;
    state.settings = settings;
    state.hostAddresses = hostAddresses;
    state.transports = transports;
    state.lastOk = Date.now();
    state.unreachable = false;
    state.loaded = true;
  } catch (error) {
    // Keep the page as it was; the notice says how old it is.
    state.unreachable = true;
  }
  render();
}
/* One mutation: the server's plain text lands in the slot for targetKey; success refreshes first, then onSuccess runs. */
async function callServer(targetKey, path, button, onSuccess) {
  if (button) button.disabled = true;
  let ok = false;
  try {
    const response = await fetch(path, { method: "POST" });
    const body = await response.json().catch(() => ({}));
    ok = response.ok && body.success !== false;
    if (ok) state.messages.delete(targetKey);
    else state.messages.set(targetKey, body.error || `HTTP ${response.status}`);
  } catch (error) {
    state.messages.set(targetKey, `Server unreachable: ${error.message}`);
  }
  if (button) button.disabled = false;
  if (ok) {
    await poll();
    if (onSuccess) onSuccess();
  }
  render();
}
function streamPath(name, action) {
  return `/api/streams/${encodeURIComponent(name)}/${action}`;
}
function queryString(pairs) {
  return new URLSearchParams(pairs).toString();
}

/* ---------- copy ---------- */
function copyText(text, button) {
  const done = () => {
    button.textContent = "Copied";
    setTimeout(() => { button.textContent = "Copy"; }, 1500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, done) {
  const area = document.createElement("textarea");
  area.value = text;
  area.setAttribute("readonly", "");
  area.style.position = "fixed";
  area.style.left = "-9999px";
  document.body.appendChild(area);
  area.select();
  try { document.execCommand("copy"); } finally { area.remove(); }
  done();
}

/* ---------- events ---------- */
document.getElementById("rows").addEventListener("click", (event) => {
  const row = event.target.closest("tr[data-name]");
  if (row) openStream(row.dataset.name);
});

document.querySelector(".bar").addEventListener("click", (event) => {
  const button = event.target.closest("button[data-act]");
  if (!button) return;
  if (button.dataset.act === "new") openCreate();
  if (button.dataset.act === "settings") openSettings();
  if (button.dataset.act === "start-all") callServer("all", "/api/streams/start-all", button);
  if (button.dataset.act === "stop-all") callServer("all", "/api/streams/stop-all", button);
});

panelNode.addEventListener("click", (event) => {
  const tab = event.target.closest('[role="tab"]');
  if (tab) { selectTab(tab.dataset.tab); return; }
  const button = event.target.closest("button[data-act]");
  if (!button) return;
  const act = button.dataset.act;
  const name = state.panel.name;
  if (act === "advertised-host") {
    const value = button.dataset.host === "localhost" ? "localhost" : state.hostAddresses[button.dataset.host];
    if (!value) return;
    const input = button.closest("form").elements.advertised_host;
    input.value = value;
    input.dispatchEvent(new Event("input", { bubbles: true }));
    return;
  }
  if (act === "copy") { copyText(button.closest("[data-copy]").dataset.copy, button); return; }
  if (act === "start") { callServer("stream:" + name, streamPath(name, "start"), button); return; }
  if (act === "stop") { callServer("stream:" + name, streamPath(name, "stop"), button); return; }
  if (act === "delete") { state.deleteArmed = name; render(); panelNode.querySelector('[data-act="delete-confirm"]').focus(); return; }
  if (act === "delete-cancel") { state.deleteArmed = null; render(); panelNode.querySelector('[data-act="delete"]').focus(); return; }
  if (act === "delete-confirm") { state.deleteArmed = null; callServer("stream:" + name, streamPath(name, "delete"), button); return; }
  if (act === "cancel") { state.drafts.delete(name); state.messages.delete("edit:" + name); render(); return; }
  if (act === "create-cancel") { state.messages.delete("create"); closePanel(); return; }
  if (act === "settings-cancel") { state.settingsDraft = null; state.messages.delete("settings"); render(); return; }
});

/* Notebook tabs: click or arrow keys; each notebook keeps its selection across polls. */
function selectTab(id, focus) {
  if (state.panel.mode === "settings") state.settingsTab = id;
  else state.tab = id;
  render();
  if (focus) panelNode.querySelector(`[role="tab"][data-tab="${id}"]`).focus();
}
panelNode.addEventListener("keydown", (event) => {
  const tab = event.target.closest('[role="tab"]');
  if (!tab) return;
  const tabs = [...tab.closest('[role="tablist"]').querySelectorAll('[role="tab"]')].map((button) => button.dataset.tab);
  const index = tabs.indexOf(tab.dataset.tab);
  if (event.key === "ArrowRight") selectTab(tabs[(index + 1) % tabs.length], true);
  else if (event.key === "ArrowLeft") selectTab(tabs[(index + tabs.length - 1) % tabs.length], true);
  else if (event.key === "Home") selectTab(tabs[0], true);
  else if (event.key === "End") selectTab(tabs[tabs.length - 1], true);
  else return;
  event.preventDefault();
});

/* Reveal invalid settings before the browser tries to focus the field. */
panelNode.addEventListener("invalid", (event) => {
  if (state.panel.mode !== "settings") return;
  const panel = event.target.closest('[role="tabpanel"]');
  if (panel && panel.hidden) selectTab(document.getElementById(panel.getAttribute("aria-labelledby")).dataset.tab);
}, true);

panelNode.addEventListener("input", (event) => {
  const form = event.target.closest("form");
  if (!form) return;
  if (form.dataset.form === "edit") {
    const stream = streamByName(state.panel.name);
    const draft = readForm(form);
    if (sameDraft(draft, draftFromStream(stream))) state.drafts.delete(stream.name); else state.drafts.set(stream.name, draft);
  }
  if (form.dataset.form === "create") {
    const draft = readForm(form);
    if (event.target.name === "name") state.nameTouched = draft.name.trim() !== "";
    if (!state.nameTouched) { draft.name = defaultName(draft); form.elements.name.value = draft.name; }
    state.createDraft = draft;
  }
  if (form.dataset.form === "settings") {
    const values = {};
    SETTING_FIELDS.forEach((field) => { values[field.key] = form.elements[field.key].value; });
    const base = settingsAsText(state.settings);
    state.settingsDraft = SETTING_FIELDS.every((field) => values[field.key] === base[field.key]) ? null : values;
  }
  render();
});

panelNode.addEventListener("submit", (event) => {
  event.preventDefault();
  const form = event.target;
  const submitter = event.submitter;
  if (form.dataset.form === "edit") {
    const name = state.panel.name;
    const draft = state.drafts.get(name);
    if (!draft) return;
    const query = { name: draft.name, file: draft.file, transport: draft.transport, ...choiceQuery(draft) };
    callServer("edit:" + name, `${streamPath(name, "settings")}?${queryString(query)}`, submitter, () => {
      state.drafts.delete(name);
      if (draft.name !== name) openStream(draft.name);
    });
  }
  if (form.dataset.form === "create") {
    const draft = state.createDraft;
    const start = submitter && submitter.dataset.act === "create-start";
    const query = { name: draft.name, file: draft.file, transport: draft.transport, ...choiceQuery(draft), start: start ? "1" : "0" };
    callServer("create", `/api/streams?${queryString(query)}`, submitter, () => openStream(draft.name));
  }
  if (form.dataset.form === "settings") {
    const values = state.settingsDraft;
    if (!values) return;
    callServer("settings", `/api/settings?${queryString(values)}`, submitter, () => { state.settingsDraft = null; });
  }
});

/* ---------- polling and freshness ---------- */
poll();
setInterval(poll, POLL_MS);
setInterval(renderNotice, 1000);
</script>
</body>
</html>
