<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Videos</title>
<link rel="icon" href="data:,">
<style>
/* Jost (SIL Open Font License), latin subset, served by the app so the page needs no internet. */
@font-face {
  font-family: "Jost";
  font-style: normal;
  font-weight: 100 900;
  font-display: swap;
  src: url(/jost.woff2) format("woff2");
}

/* ---- tokens: the control page's palette ---- */
:root {
  --ground: #F7F6F2;
  --ink: #141414;
  --muted: #5F5D58;
  --rule: #CFCCC4;
  --box: #ECEAE3;
  --blue: #1D4ED8;
  --blue-fill: #1D4ED8;
  --red: #C8201A;
  --on-fill: #FFFFFF;
  --sans: "Jost", "Futura", "Avenir Next", "Century Gothic", "URW Gothic", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ground: #121212;
    --ink: #ECEAE4;
    --muted: #A09D96;
    --rule: #3A3936;
    --box: #1D1C1A;
    --blue: #7A9CFF;
    --blue-fill: #2F5FE0;
    --red: #FF6B5E;
    --on-fill: #FFFFFF;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html { background: var(--ground); }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font: 400 15px/24px var(--sans);
}
h1 { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

.page { max-width: 1200px; margin: 0 auto; padding: 24px 40px 40px; }
@media (max-width: 999px) { .page { padding: 16px 24px 32px; } }
@media (max-width: 599px) { .page { padding: 16px 16px 32px; } }

.head { padding-bottom: 16px; border-bottom: 3px solid var(--ink); }
.head h1 { font-size: 32px; line-height: 40px; font-weight: 500; letter-spacing: -0.01em; }

button {
  font-weight: 500;
  background: transparent;
  color: var(--ink);
  border: 2px solid var(--ink);
  border-radius: 0;
  padding: 4px 14px;
  min-height: 36px;
  min-width: 84px;
  cursor: pointer;
}
button.primary { background: var(--blue-fill); border-color: var(--blue-fill); color: var(--on-fill); }
button:disabled { color: var(--muted); border-color: var(--rule); background: transparent; cursor: default; }
@media (max-width: 999px) { button { min-height: 40px; } }

.list { width: 100%; border-collapse: collapse; margin-top: 24px; }
.list th {
  text-align: left;
  font-size: 13px; line-height: 16px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 0 12px 8px 0;
  border-bottom: 2px solid var(--ink);
  white-space: nowrap;
}
.list td { padding: 12px 12px 12px 0; border-bottom: 1px solid var(--rule); vertical-align: middle; }
.list td.c-file { font-weight: 500; overflow-wrap: anywhere; }
.list td.c-action { text-align: right; padding-right: 0; }
.state { font-weight: 500; }
.state.is-running { color: var(--blue); }
.state.is-failed, .state.is-crashing { color: var(--red); }
.reason { display: block; font-size: 13px; line-height: 20px; color: var(--muted); }
.reason:empty, .message:empty { display: none; }
.address { display: flex; gap: 8px; align-items: center; }
.address code {
  flex: 1 1 auto;
  min-width: 0;
  font-family: var(--mono); font-size: 13px; line-height: 20px;
  background: var(--box);
  padding: 6px 10px;
  overflow-wrap: anywhere;
}
.message { display: block; margin-top: 4px; font-family: var(--mono); font-size: 13px; line-height: 20px; color: var(--red); }
.empty { padding: 16px 0; color: var(--muted); }

@media (max-width: 719px) {
  .list thead { display: none; }
  .list, .list tbody { display: block; }
  .list tr {
    display: grid;
    grid-template-columns: 1fr auto;
    grid-template-areas:
      "file action"
      "state state"
      "address address";
    gap: 8px 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--rule);
  }
  .list td { display: block; padding: 0; border: 0; }
  .list td.c-file { grid-area: file; align-self: center; }
  .list td.c-state { grid-area: state; }
  .list td.c-address { grid-area: address; }
  .list td.c-action { grid-area: action; }
}
</style>
</head>
<body>
<div class="page">
  <header class="head"><h1>Videos</h1></header>
  <table class="list">
    <thead>
      <tr><th>File</th><th>State</th><th>Address</th><th></th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <p class="empty" id="empty" hidden>No videos</p>
</div>
<script>
"use strict";

const POLL_MS = 2000;
/* Per-file refusal text from the last Play or Stop, keyed by file name. */
const messages = new Map();
const busy = new Set();

function escapeHtml(text) {
  return String(text ?? "").replace(/[&<>"']/g, (character) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
  })[character]);
}

function rowHtml(row) {
  const state = row.state ?? "stopped";
  const address = row.url
    ? `<div class="address" data-copy="${escapeHtml(row.url)}">
         <code>${escapeHtml(row.url)}</code>
         <button type="button" data-act="copy">Copy</button>
       </div>`
    : "";
  const action = row.playing
    ? `<button type="button" data-act="stop">Stop</button>`
    : `<button type="button" class="primary" data-act="start">Play</button>`;
  return `<tr data-file="${escapeHtml(row.file)}">
    <td class="c-file">${escapeHtml(row.file)}</td>
    <td class="c-state"><span class="state is-${escapeHtml(state)}">${escapeHtml(state)}</span>
      <span class="reason">${row.reason === state ? "" : escapeHtml(row.reason)}</span></td>
    <td class="c-address">${address}</td>
    <td class="c-action">${action}
      <span class="message">${escapeHtml(messages.get(row.file))}</span></td>
  </tr>`;
}

async function refresh() {
  try {
    const response = await fetch("/api/play", { cache: "no-store" });
    if (!response.ok) return;
    const rows = await response.json();
    document.getElementById("rows").innerHTML = rows.map(rowHtml).join("");
    document.getElementById("empty").hidden = rows.length > 0;
    for (const file of busy) {
      const button = document.querySelector(`tr[data-file="${CSS.escape(file)}"] .c-action button`);
      if (button) button.disabled = true;
    }
  } catch (error) {
    /* The next poll tries again. */
  }
}

async function playOrStop(file, action) {
  busy.add(file);
  messages.delete(file);
  await refresh();
  try {
    const query = new URLSearchParams({ file }).toString();
    const response = await fetch(`/api/play/${action}?${query}`, { method: "POST" });
    if (!response.ok) {
      const body = await response.json().catch(() => ({}));
      messages.set(file, body.error || `Request failed (${response.status})`);
    }
  } catch (error) {
    messages.set(file, "No answer from the server");
  } finally {
    busy.delete(file);
    await refresh();
  }
}

function copyText(text, button) {
  const done = () => {
    button.textContent = "Copied";
    setTimeout(() => { button.textContent = "Copy"; }, 1500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, done) {
  const area = document.createElement("textarea");
  area.value = text;
  area.setAttribute("readonly", "");
  area.style.position = "fixed";
  area.style.left = "-9999px";
  document.body.appendChild(area);
  area.select();
  try { document.execCommand("copy"); } finally { area.remove(); }
  done();
}

document.getElementById("rows").addEventListener("click", (event) => {
  const button = event.target.closest("button[data-act]");
  if (!button) return;
  const act = button.dataset.act;
  if (act === "copy") { copyText(button.closest("[data-copy]").dataset.copy, button); return; }
  playOrStop(button.closest("tr[data-file]").dataset.file, act);
});

refresh();
setInterval(refresh, POLL_MS);
</script>
</body>
</html>
