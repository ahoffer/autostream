<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Stream Control</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2316213e'/%3E%3Cpath d='M5 3.5v9l7-4.5z' fill='%2300d4ff'/%3E%3C/svg%3E">
    <style>
        * { box-sizing: border-box; }
        /* The hidden attribute must beat the display rules below. */
        [hidden] { display: none !important; }
        html, body { height: 100%; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
               background: #1a1a2e; color: #eee; display: grid; grid-template-columns: 280px minmax(0, 1fr); }
        button { padding: 6px 14px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; transition: opacity 0.2s; }
        button:hover { opacity: 0.8; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-start { background: #00c853; color: #000; }
        .btn-stop { background: #ff5252; color: #fff; }
        .btn-plain { background: transparent; color: #eee; border: 1px solid #8a93a8; }
        select, input[type=number] { padding: 8px 10px; border-radius: 4px; background: #0f3460; color: #fff;
                                     border: 1px solid #0f3460; font-size: 14px; width: 100%; }
        select:focus, input:focus { border-color: #00d4ff; outline: none; }
        /* Keyboard focus only: a visible ring for Tab users, none on mouse clicks. */
        :focus-visible { outline: 2px solid #00d4ff; outline-offset: 2px; }
        .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

        /* Sidebar: the stream list */
        .sidebar { display: flex; flex-direction: column; background: #16213e; border-right: 1px solid #0f3460; padding: 20px 0; min-height: 100vh; }
        .sidebar-header { display: flex; align-items: center; justify-content: space-between; padding: 0 18px 16px; }
        .sidebar-header h1 { margin: 0; font-size: 18px; color: #00d4ff; }
        .sidebar-header span { font-size: 12px; color: #8a93a8; }
        .stale { color: #ffb74d; }
        .stream-item { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 12px 18px;
                       font-size: 14px; color: #eee; background: transparent; border: none; border-left: 3px solid transparent;
                       border-radius: 0; text-align: left; }
        .stream-item:hover { background: #1b2a4f; opacity: 1; }
        .stream-item.selected { background: #0f3460; border-left-color: #00d4ff; font-weight: 600; }
        .dots { display: flex; gap: 6px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot.running { background: #00c853; }
        .dot.waiting, .dot.starting, .dot.restarting { background: #ffb74d; }
        .dot.crashing, .dot.failed { background: #ff5252; }
        .dot.stopped, .dot.completed { background: #2a2f4a; border: 2px solid #8a93a8; }
        .dot.stopped { border-color: #ff5252; }
        .sidebar-footer { margin-top: auto; display: flex; gap: 8px; padding: 16px 18px 0; }
        .sidebar-footer button { flex: 1; padding: 8px 0; }

        /* Detail pane: the selected stream */
        .detail { display: flex; flex-direction: column; gap: 16px; padding: 28px 32px; max-width: 1000px; }
        #detail { display: flex; flex-direction: column; gap: 22px; }
        .detail-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
        .detail-title { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
        .detail-title h2 { margin: 0; font-size: 24px; }
        .detail-title span { font-size: 12px; color: #8a93a8; }
        .header-buttons { display: flex; gap: 8px; }
        .header-buttons button { padding: 8px 16px; }
        .settings { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
        .settings label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #8a93a8;
                          text-transform: uppercase; letter-spacing: 0.04em; }
        .settings input:disabled { opacity: 0.4; }
        .hint { font-size: 12px; text-transform: none; letter-spacing: 0; min-height: 1.2em; }
        .hint a { color: #00d4ff; }
        .settings-actions { display: flex; align-items: center; gap: 10px; font-size: 13px; color: #ffb74d; }
        .reason { color: #ffb74d; font-style: italic; font-size: 13px; }
        .output { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; background: #16213e; border-radius: 8px; }
        .output-header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .output-header .name { font-weight: 700; color: #00d4ff; width: 48px; }
        .output-header .note { color: #8a93a8; font-size: 13px; }
        .output-header .spacer { flex: 1; }
        .pill { padding: 3px 10px; border-radius: 10px; font-size: 12px; font-weight: 600; }
        .pill.running { background: #00c853; color: #000; }
        .pill.waiting, .pill.starting, .pill.restarting { background: #ffb74d; color: #000; }
        .pill.crashing { background: #ff5252; color: #fff; }
        .pill.failed { background: #2a2f4a; color: #ff8a8a; border: 1px solid #ff5252; }
        .pill.stopped { background: #2a2f4a; color: #ff8a8a; border: 1px solid #ff5252; }
        .pill.completed { background: #2a2f4a; color: #8a93a8; border: 1px solid #8a93a8; }
        pre.err { margin: 0; padding: 8px 10px; background: #4a1e1e; color: #ffb4b4; border-radius: 4px;
                  white-space: pre-wrap; word-break: break-all; font-size: 11.5px; }
        .url-grid { display: grid; grid-template-columns: 48px 1fr auto; gap: 8px; align-items: center; font-size: 13px; }
        .url-grid .label { color: #8a93a8; }
        .url-grid .url { color: #ccc; word-break: break-all; }
        .url-grid.inactive .url { opacity: 0.45; text-decoration: line-through; }
        .url-grid .url.none { text-decoration: none; opacity: 1; color: #8a93a8; }
        .copy-btn { background: transparent; border: none; color: #8a93a8; cursor: pointer; padding: 2px 6px;
                    border-radius: 3px; display: inline-flex; align-items: center; gap: 4px; font-size: 12px; }
        .copy-btn:hover { color: #00d4ff; background: rgba(0, 212, 255, 0.1); opacity: 1; }
        .copy-btn.copied { color: #00c853; }
        .copy-btn.copy-failed { color: #ff5252; }
        .copy-btn svg { width: 16px; height: 16px; }
        details { font-size: 12px; color: #8a93a8; }
        summary { cursor: pointer; color: #00d4ff; }
        pre.command { margin: 8px 0 0; padding: 10px; background: #0f3460; color: #bbb; border-radius: 4px;
                      white-space: pre-wrap; word-break: break-all; font-size: 11.5px; }
        .error-banner { display: flex; align-items: center; gap: 12px; background: #4a1e1e; border: 1px solid #ff5252;
                        color: #ffb4b4; border-radius: 4px; padding: 10px 12px; }
        .error-banner span { flex: 1; }
        .error-banner button { background: transparent; color: #ffb4b4; border: 1px solid #ff5252; padding: 2px 10px; }
        .empty { color: #8a93a8; }

        /* Narrow windows: the stream list becomes a strip across the top. */
        @media (max-width: 800px) {
            body { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; }
            .sidebar { min-height: 0; border-right: none; border-bottom: 1px solid #0f3460; padding: 12px 0; }
            #list { display: flex; overflow-x: auto; }
            .stream-item { width: auto; flex: 0 0 auto; gap: 8px; border-left: none; border-bottom: 3px solid transparent; }
            .stream-item.selected { border-bottom-color: #00d4ff; }
            .sidebar-footer { margin-top: 12px; }
            .detail { padding: 16px; }
            .settings { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
    </style>
</head>
<body>
    <nav class="sidebar">
        <div class="sidebar-header"><h1>Streams</h1><span id="count"></span></div>
        <div id="list"></div>
        <div class="sidebar-footer" id="all-buttons">
            <button class="btn-stop" onclick="stopAll(this)">Stop All</button>
            <button class="btn-start" onclick="startAll(this)">Start All</button>
        </div>
    </nav>
    <main class="detail">
        <div id="error" class="error-banner" hidden>
            <span id="error-text"></span>
            <button onclick="hideError()" title="Dismiss">Dismiss</button>
        </div>
        <div id="detail"></div>
    </main>
    <script>
        const copyIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`;

        let streams = [];
        let selectedName = null;
        // Unapplied settings edits for the selected stream: null when the
        // controls show the server's values. fps/gop null means "automatic".
        let draft = null;
        // Output names whose command view is open, so a rewrite keeps it open.
        const openCommands = new Set();
        let lastPayload = '';
        let lastUpdate = null;

        function escapeHtml(text) {
            return String(text).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
        }

        const stateLabels = {running: 'Running', crashing: 'Crashing', restarting: 'Restarting', starting: 'Starting',
                             waiting: 'Waiting', failed: 'Failed', stopped: 'Stopped', completed: 'Completed'};

        function fmtRate(rate) { return rate ? `${Math.round(rate * 100) / 100} fps` : 'unknown'; }

        function renderList() {
            const focused = document.activeElement && document.activeElement.dataset.stream;
            document.getElementById('count').textContent = streams.length;
            document.getElementById('all-buttons').hidden = streams.length === 0;
            document.getElementById('list').innerHTML = streams.map(s => `
                <button class="stream-item${s.name === selectedName ? ' selected' : ''}" data-stream="${s.name}" onclick="select('${s.name}')">
                    <span>${s.name}</span>
                    <span class="dots">
                        <span class="dot ${s.outputs.rtsp.state}" title="rtsp: ${s.outputs.rtsp.state}"></span>
                        <span class="dot ${s.outputs.udp.state}" title="udp: ${s.outputs.udp.state}"></span>
                    </span>
                </button>`).join('');
            // A rewrite drops keyboard focus to the body; put it back on the same row.
            if (focused) document.querySelector(`.stream-item[data-stream="${focused}"]`)?.focus();
        }

        function urlRow(label, url, active) {
            return `<span class="label">${label}</span>
                <span class="url mono${url ? '' : ' none'}">${url ?? 'none assigned'}</span>
                ${active ? `<button class="copy-btn" title="Copy ${label} URL" onclick='copyUrl(this, ${JSON.stringify(url)})'>${copyIcon}</button>` : '<span></span>'}`;
        }

        function outputCard(s, outputName, urls, note) {
            const output = s.outputs[outputName];
            const state = output.state;
            return `<div class="output">
                <div class="output-header">
                    <span class="name">${outputName.toUpperCase()}</span>
                    <span class="pill ${state}">${stateLabels[state] ?? state}</span>
                    ${output.reason && output.enabled ? `<span class="reason">${escapeHtml(output.reason)}</span>` : `<span class="note">${note}</span>`}
                    <span class="spacer"></span>
                    <button class="btn-stop" onclick="stopOutput(this, '${s.name}', '${outputName}')" ${output.enabled ? '' : 'disabled'}>Stop</button>
                    <button class="btn-start" onclick="startOutput(this, '${s.name}', '${outputName}')">${output.running ? 'Restart' : 'Start'}</button>
                </div>
                ${output.error ? `<pre class="err mono" title="Last lines of the ffmpeg log">${escapeHtml(output.error)}</pre>` : ''}
                <div class="url-grid${output.running ? '' : ' inactive'}">
                    ${urls.map(([label, url]) => urlRow(label, url, output.running)).join('')}
                </div>
                ${output.command === null ? '' : `
                <details ${openCommands.has(outputName) ? 'open' : ''} ontoggle="toggleCommand('${outputName}', this.open)">
                    <summary>Command</summary>
                    <pre class="command mono">${escapeHtml(output.command)}</pre>
                </details>`}
            </div>`;
        }

        // The settings the controls should show: the draft while editing,
        // else the server's values.
        function currentSettings(s) {
            return draft ?? {
                mode: s.mode, loop: s.loop_count,
                fps: s.frame_rate_explicit ? s.frame_rate : null,
                gop: s.gop_explicit ? s.gop_frames : null,
            };
        }

        function settingsRow(s) {
            const v = currentSettings(s);
            const dirty = draft !== null;
            const outputRate = v.fps ?? s.source_frame_rate;
            const naturalGop = outputRate ? Math.max(1, Math.round(outputRate)) : 30;
            // FPS and GOP are encoder settings: nothing to set when the source
            // is copied. A passthrough request on an ineligible file still
            // transcodes, so follow what would actually run.
            const copying = v.mode === 'passthrough' && s.passthrough_eligible !== false;
            const off = copying ? 'disabled' : '';
            const modeNote = v.mode === 'passthrough' && s.passthrough_eligible === false
                ? `<span class="reason">transcodes anyway: ${escapeHtml(s.ineligible_codecs.join(', '))} cannot pass through (H.264/H.265 only)</span>` : '';
            return `
                <div class="settings">
                    <label>Video
                        <select id="mode" onchange="edit('mode', this.value)" title="Passthrough sends the source unmodified (H.264/H.265 only)">
                            <option value="passthrough" ${v.mode === 'passthrough' ? 'selected' : ''}>Passthrough</option>
                            <option value="transcode" ${v.mode === 'transcode' ? 'selected' : ''}>Transcode</option>
                        </select>
                        <span class="hint">${modeNote}</span>
                    </label>
                    <label>FPS
                        <input type="number" id="fps" min="1" max="120" step="any" value="${Math.round(outputRate * 1000) / 1000 || ''}" ${off}
                               oninput="edit('fps', this.value === '' ? null : Number(this.value))" title="Output frame rate. Transcode only.">
                        <span class="hint">${v.fps !== null
                            ? `<a href="#" onclick="edit('fps', null); return false;">reset to source (${fmtRate(s.source_frame_rate)})</a>`
                            : `source rate (${fmtRate(s.source_frame_rate)})`}</span>
                    </label>
                    <label>GOP (frames)
                        <input type="number" id="gop" min="1" step="1" value="${v.gop ?? naturalGop}" ${off}
                               oninput="edit('gop', this.value === '' ? null : Number(this.value))" title="Keyframe interval; one second of frames unless changed. Transcode only.">
                        <span class="hint">${v.gop !== null
                            ? `<a href="#" onclick="edit('gop', null); return false;">reset to one second</a>`
                            : 'one second at the output rate'}</span>
                    </label>
                    <label>Playback
                        <select id="loop" onchange="edit('loop', Number(this.value))">
                            <option value="-1" ${v.loop === -1 ? 'selected' : ''}>Loop forever</option>
                            <option value="0" ${v.loop === 0 ? 'selected' : ''}>Play once</option>
                            <option value="1" ${v.loop === 1 ? 'selected' : ''}>Play 2x</option>
                            <option value="2" ${v.loop === 2 ? 'selected' : ''}>Play 3x</option>
                            <option value="4" ${v.loop === 4 ? 'selected' : ''}>Play 5x</option>
                            <option value="9" ${v.loop === 9 ? 'selected' : ''}>Play 10x</option>
                        </select>
                        <span class="hint"></span>
                    </label>
                </div>
                <div class="settings-actions" ${dirty ? '' : 'hidden'}>
                    <button class="btn-start" onclick="applySettings(this, '${s.name}')">Apply</button>
                    <button class="btn-plain" onclick="cancelSettings()">Cancel</button>
                    <span>${s.running ? 'Apply restarts the running stream with the new values' : 'Apply saves the values for the next start'}</span>
                </div>`;
        }

        function renderDetail() {
            const s = streams.find(x => x.name === selectedName);
            const detail = document.getElementById('detail');
            const active = document.activeElement && document.activeElement.closest('#detail')
                           ? document.activeElement.id : null;
            renderDetailNow(s, detail);
            if (active) document.getElementById(active)?.focus();
        }

        function renderDetailNow(s, detail) {
            if (!s) {
                detail.innerHTML = `<p class="empty">${streams.length ? 'Select a stream' : 'No videos in the videos directory'}</p>`;
                return;
            }
            detail.innerHTML = `
                <div class="detail-header">
                    <div class="detail-title">
                        <h2>${s.name}</h2>
                        <span class="mono">${escapeHtml(s.filename)} · ${escapeHtml(s.encoder)}</span>
                    </div>
                    <div class="header-buttons">
                        <button class="btn-stop" onclick="stopStream(this, '${s.name}')" ${s.running ? '' : 'disabled'}>Stop</button>
                        <button class="btn-start" onclick="startStream(this, '${s.name}')">${s.running ? 'Restart' : 'Start'}</button>
                    </div>
                </div>
                ${settingsRow(s)}
                ${outputCard(s, 'rtsp', [['rtsp', s.rtsp_url], ['hls', s.hls_url]], 'RTSP and HLS through MediaMTX')}
                ${outputCard(s, 'udp', [['udp', s.udp_url]], 'MPEG-TS with KLV metadata')}`;
        }

        function render() {
            if (!streams.some(s => s.name === selectedName)) {
                selectedName = streams.length ? streams[0].name : null;
                draft = null;
            }
            renderList();
            renderDetail();
        }

        function showStale() {
            const count = document.getElementById('count');
            if (lastUpdate === null) return;
            const age = Math.round((Date.now() - lastUpdate) / 1000);
            if (age > 12) {
                count.textContent = `updates stalled ${age}s`;
                count.className = 'stale';
            }
        }

        async function loadStreams(force) {
            try {
                const res = await fetch('/api/streams');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const payload = await res.text();
                lastUpdate = Date.now();
                document.getElementById('count').className = '';
                // Skip the rewrite when nothing changed: no flicker.
                if (!force && payload === lastPayload) return;
                lastPayload = payload;
                streams = JSON.parse(payload);
                render();
            } catch (err) {
                // Keep the page as it was; the sidebar says how old it is.
                showStale();
            }
        }

        function select(name) {
            if (name === selectedName) return;
            selectedName = name;
            draft = null;
            render();
        }

        // ---- Settings draft ----

        function edit(key, value) {
            const s = streams.find(x => x.name === selectedName);
            if (draft === null) draft = currentSettings(s);
            draft[key] = value;
            renderDetail();   // hints and Apply/Cancel follow the draft
        }

        function cancelSettings() {
            draft = null;
            document.activeElement.blur();
            renderDetail();
        }

        async function applySettings(button, name) {
            const v = draft;
            document.activeElement.blur();
            const query = `mode=${v.mode}&loop=${v.loop}&fps=${v.fps ?? 'auto'}&gop=${v.gop ?? 'auto'}`;
            // The draft stays until the server accepts it, so a rejected
            // value can be corrected rather than retyped.
            if (await command(button, `/api/streams/${name}/settings?${query}`, `apply ${name} settings`)) {
                draft = null;
                renderDetail();
            }
        }

        // ---- Commands ----

        function toggleCommand(outputName, open) {
            if (open) openCommands.add(outputName); else openCommands.delete(outputName);
        }

        async function copyUrl(btn, text) {
            const flash = (cls, word) => {
                btn.classList.add(cls);
                const note = document.createElement('span');
                note.textContent = word;
                btn.appendChild(note);
                setTimeout(() => { btn.classList.remove(cls); note.remove(); }, 1200);
            };
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                    flash('copied', 'Copied');
                    return;
                }
                // Fallback for plain-HTTP origins where the Clipboard API is unavailable.
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.setAttribute('readonly', '');
                ta.style.position = 'fixed';
                ta.style.top = '0';
                ta.style.left = '0';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.focus();
                ta.select();
                ta.setSelectionRange(0, text.length);
                const ok = document.execCommand('copy');
                document.body.removeChild(ta);
                if (!ok) throw new Error('execCommand("copy") returned false');
                flash('copied', 'Copied');
            } catch (err) {
                console.error('Copy failed:', err);
                btn.title = 'Copy failed: ' + err.message;
                flash('copy-failed', 'Failed');
            }
        }

        function showError(message) {
            document.getElementById('error-text').textContent = message;
            document.getElementById('error').hidden = false;
        }

        function hideError() {
            document.getElementById('error').hidden = true;
        }

        // Every control goes through here. The clicked button is disabled
        // and relabelled until the refresh lands, so a second click cannot
        // fire the same command twice. A refused operation comes back as
        // {"success": false} with a 200, so checking only the transport would
        // leave a failed click looking like it worked.
        async function command(button, path, description) {
            const label = button && button.textContent;
            if (button) {
                button.disabled = true;
                button.textContent = label + '…';
            }
            let ok = false;
            try {
                const res = await fetch(path, {method: 'POST'});
                const result = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(result.error || `HTTP ${res.status}`);
                if (result.success === false) throw new Error('the supervisor could not complete it; check its log');
                hideError();
                ok = true;
            } catch (err) {
                showError(`Could not ${description}: ${err.message}`);
            }
            await loadStreams(true);
            // Buttons in re-rendered panes are gone by now; static ones (the
            // sidebar footer) must be put back by hand.
            if (button && button.isConnected) {
                button.disabled = false;
                button.textContent = label;
            }
            return ok;
        }

        function startStream(button, name) { return command(button, `/api/streams/${name}/start`, `start ${name}`); }
        function stopStream(button, name) { return command(button, `/api/streams/${name}/stop`, `stop ${name}`); }
        function stopAll(button) { return command(button, '/api/streams/stop-all', 'stop all streams'); }
        function startAll(button) { return command(button, '/api/streams/start-all', 'start all streams'); }
        function startOutput(button, name, output) { return command(button, `/api/streams/${name}/outputs/${output}/start`, `start ${name}/${output}`); }
        function stopOutput(button, name, output) { return command(button, `/api/streams/${name}/outputs/${output}/stop`, `stop ${name}/${output}`); }

        loadStreams();
        setInterval(loadStreams, 5000);
        setInterval(showStale, 5000);
    </script>
</body>
</html>
