<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Stream Control</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
               background: #1a1a2e; color: #eee; display: grid; grid-template-columns: 280px minmax(0, 1fr); }
        button { padding: 6px 14px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; transition: opacity 0.2s; }
        button:hover { opacity: 0.8; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-start { background: #00c853; color: #000; }
        .btn-stop { background: #ff5252; color: #fff; }
        select, input[type=number] { padding: 8px 10px; border-radius: 4px; background: #0f3460; color: #fff;
                                     border: 1px solid #00d4ff; font-size: 14px; width: 100%; }
        .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

        /* Sidebar: the stream list */
        .sidebar { display: flex; flex-direction: column; background: #16213e; border-right: 1px solid #0f3460; padding: 20px 0; min-height: 100vh; }
        .sidebar-header { display: flex; align-items: center; justify-content: space-between; padding: 0 18px 16px; }
        .sidebar-header h1 { margin: 0; font-size: 18px; color: #00d4ff; }
        .sidebar-header span { font-size: 12px; color: #8a93a8; }
        .stream-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; font-size: 14px;
                       cursor: pointer; border-left: 3px solid transparent; }
        .stream-item:hover { background: #1b2a4f; }
        .stream-item.selected { background: #0f3460; border-left-color: #00d4ff; font-weight: 600; }
        .dots { display: flex; gap: 6px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot.running { background: #00c853; }
        .dot.waiting { background: #ffb74d; }
        .dot.stopped { border: 1px solid #ff5252; }
        .sidebar-footer { margin-top: auto; display: flex; gap: 8px; padding: 16px 18px 0; }
        .sidebar-footer button { flex: 1; padding: 8px 0; }

        /* Detail pane: the selected stream */
        .detail { display: flex; flex-direction: column; gap: 22px; padding: 28px 32px; max-width: 960px; }
        .detail-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
        .detail-title { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
        .detail-title h2 { margin: 0; font-size: 24px; }
        .detail-title span { font-size: 12px; color: #8a93a8; }
        .header-buttons { display: flex; gap: 8px; }
        .header-buttons button { padding: 8px 16px; }
        .settings { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
        .settings label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #8a93a8;
                          text-transform: uppercase; letter-spacing: 0.04em; }
        .reason { color: #ffb74d; font-style: italic; font-size: 13px; }
        .output { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; background: #16213e; border-radius: 8px; }
        .output-header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .output-header .name { font-weight: 700; color: #00d4ff; width: 48px; }
        .output-header .spacer { flex: 1; }
        .pill { padding: 3px 10px; border-radius: 10px; font-size: 12px; font-weight: 600; }
        .pill.running { background: #00c853; color: #000; }
        .pill.waiting { background: #ffb74d; color: #000; }
        .pill.stopped { background: #2a2f4a; color: #ff8a8a; border: 1px solid #ff5252; }
        .url-grid { display: grid; grid-template-columns: 48px 1fr 28px; gap: 8px; align-items: center; font-size: 13px; }
        .url-grid .label { color: #8a93a8; }
        .url-grid .url { color: #ccc; word-break: break-all; }
        .url-grid.inactive .url { opacity: 0.45; text-decoration: line-through; }
        .copy-btn { background: transparent; border: none; color: #8a93a8; cursor: pointer; padding: 2px 4px;
                    border-radius: 3px; display: inline-flex; align-items: center; }
        .copy-btn:hover { color: #00d4ff; background: rgba(0, 212, 255, 0.1); }
        .copy-btn.copied { color: #00c853; }
        .copy-btn.copy-failed { color: #ff5252; }
        .copy-btn svg { width: 16px; height: 16px; }
        details { font-size: 12px; color: #8a93a8; }
        summary { cursor: pointer; color: #00d4ff; }
        pre.command { margin: 8px 0 0; padding: 10px; background: #0f3460; color: #bbb; border-radius: 4px;
                      white-space: pre-wrap; word-break: break-all; font-size: 11.5px; }
        .error-banner { background: #4a1e1e; border: 1px solid #ff5252; color: #ffb4b4; border-radius: 4px; padding: 10px 12px; }
        .empty { color: #8a93a8; }
    </style>
</head>
<body>
    <nav class="sidebar">
        <div class="sidebar-header"><h1>Streams</h1><span id="count"></span></div>
        <div id="list"></div>
        <div class="sidebar-footer">
            <button class="btn-stop" onclick="stopAll()">Stop All</button>
            <button class="btn-start" onclick="startAll()">Start All</button>
        </div>
    </nav>
    <main class="detail">
        <div id="error" class="error-banner" hidden></div>
        <div id="detail"></div>
    </main>
    <script>
        const copyIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`;

        let streams = [];
        let selectedName = null;
        // Output names whose command view is open, so a rewrite keeps it open.
        const openCommands = new Set();
        let lastPayload = '';

        function escapeHtml(text) {
            return String(text).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
        }

        function outputState(output) {
            return output.running ? 'running' : output.enabled ? 'waiting' : 'stopped';
        }

        function renderList() {
            document.getElementById('count').textContent = streams.length;
            document.getElementById('list').innerHTML = streams.map(s => `
                <div class="stream-item${s.name === selectedName ? ' selected' : ''}" onclick="select('${s.name}')">
                    <span>${s.name}</span>
                    <span class="dots">
                        <span class="dot ${outputState(s.outputs.rtsp)}" title="rtsp"></span>
                        <span class="dot ${outputState(s.outputs.udp)}" title="udp"></span>
                    </span>
                </div>`).join('');
        }

        function urlRow(label, url, active) {
            return `<span class="label">${label}</span>
                <span class="url mono">${url ?? 'none assigned'}</span>
                ${active ? `<button class="copy-btn" title="Copy ${label} URL" onclick='copyUrl(this, ${JSON.stringify(url)})'>${copyIcon}</button>` : '<span></span>'}`;
        }

        function outputCard(s, outputName, urls, note) {
            const output = s.outputs[outputName];
            const state = outputState(output);
            const label = {running: 'Running', waiting: 'Waiting', stopped: 'Stopped'}[state];
            return `<div class="output">
                <div class="output-header">
                    <span class="name">${outputName.toUpperCase()}</span>
                    <span class="pill ${state}">${label}</span>
                    ${output.reason && output.enabled ? `<span class="reason">${escapeHtml(output.reason)}</span>` : `<span class="reason" style="color:#8a93a8;font-style:normal">${note}</span>`}
                    <span class="spacer"></span>
                    <button class="btn-stop" onclick="stopOutput('${s.name}', '${outputName}')" ${output.enabled ? '' : 'disabled'}>Stop</button>
                    <button class="btn-start" onclick="startOutput('${s.name}', '${outputName}')">${output.running ? 'Restart' : 'Start'}</button>
                </div>
                <div class="url-grid${output.running ? '' : ' inactive'}">
                    ${urls.map(([label, url]) => urlRow(label, url, output.running)).join('')}
                </div>
                ${output.command === null ? '' : `
                <details ${openCommands.has(outputName) ? 'open' : ''} ontoggle="toggleCommand('${outputName}', this.open)">
                    <summary>Command</summary>
                    <pre class="command mono">${escapeHtml(output.command)}</pre>
                </details>`}
            </div>`;
        }

        function renderDetail() {
            const s = streams.find(x => x.name === selectedName);
            const detail = document.getElementById('detail');
            if (!s) {
                detail.innerHTML = `<p class="empty">${streams.length ? 'Select a stream' : 'No videos in the videos directory'}</p>`;
                return;
            }
            const modeNote = s.mode === 'passthrough' && !s.passthrough_active && s.passthrough_reason
                ? `<span class="reason">transcoding — ${escapeHtml(s.passthrough_reason)}</span>` : '';
            detail.innerHTML = `
                <div class="detail-header">
                    <div class="detail-title">
                        <h2>${s.name}</h2>
                        <span class="mono">${escapeHtml(s.filename)} · ${escapeHtml(s.encoder)}</span>
                    </div>
                    <div class="header-buttons">
                        <button class="btn-stop" onclick="stopStream('${s.name}')" ${s.running ? '' : 'disabled'}>Stop</button>
                        <button class="btn-start" onclick="startStream('${s.name}')">${s.running ? 'Restart' : 'Start'}</button>
                    </div>
                </div>
                <div class="settings">
                    <label>Video
                        <select id="mode" onchange="settingChanged('${s.name}', ${s.running})" title="Passthrough sends the source unmodified (H.264/H.265 only)">
                            <option value="passthrough" ${s.mode === 'passthrough' ? 'selected' : ''}>Passthrough</option>
                            <option value="transcode" ${s.mode === 'transcode' ? 'selected' : ''}>Transcode</option>
                        </select>
                        ${modeNote}
                    </label>
                    <label>Loop
                        <select id="loop" onchange="settingChanged('${s.name}', ${s.running})">
                            <option value="-1" ${s.loop_count === -1 ? 'selected' : ''}>Infinite</option>
                            <option value="0" ${s.loop_count === 0 ? 'selected' : ''}>Play 1x</option>
                            <option value="1" ${s.loop_count === 1 ? 'selected' : ''}>Play 2x</option>
                            <option value="2" ${s.loop_count === 2 ? 'selected' : ''}>Play 3x</option>
                            <option value="4" ${s.loop_count === 4 ? 'selected' : ''}>Play 5x</option>
                            <option value="9" ${s.loop_count === 9 ? 'selected' : ''}>Play 10x</option>
                        </select>
                    </label>
                    <label>GOP (frames)
                        <input type="number" id="gop" min="1" step="1" value="${s.gop_frames}" onchange="settingChanged('${s.name}', ${s.running})" title="Keyframe interval (transcode only)">
                    </label>
                </div>
                ${outputCard(s, 'rtsp', [['rtsp', s.rtsp_url], ['hls', s.hls_url]], 'RTSP and HLS through MediaMTX')}
                ${outputCard(s, 'udp', [['udp', s.udp_url]], 'MPEG-TS with KLV metadata')}`;
        }

        function render() {
            if (!streams.some(s => s.name === selectedName)) selectedName = streams.length ? streams[0].name : null;
            renderList();
            renderDetail();
        }

        async function loadStreams(force) {
            // Never rewrite while a value is being typed: the caret would be
            // lost. The next poll after blur catches up.
            if (!force && document.activeElement && document.activeElement.tagName === 'INPUT') return;
            try {
                const res = await fetch('/api/streams');
                const payload = await res.text();
                // Skip the rewrite when nothing changed: no flicker, and an
                // unsubmitted selection survives the 5s poll.
                if (!force && payload === lastPayload) return;
                lastPayload = payload;
                streams = JSON.parse(payload);
                render();
            } catch (err) {
                document.getElementById('detail').innerHTML = '<p style="color:#ff5252">Error loading streams: ' + err.message + '</p>';
            }
        }

        function select(name) {
            selectedName = name;
            render();
        }

        function toggleCommand(outputName, open) {
            if (open) openCommands.add(outputName); else openCommands.delete(outputName);
        }

        async function copyUrl(btn, text) {
            const flash = (cls) => {
                btn.classList.add(cls);
                setTimeout(() => btn.classList.remove(cls), 1000);
            };
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                    flash('copied');
                    return;
                }
                // Fallback for plain-HTTP origins where the Clipboard API is unavailable.
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.setAttribute('readonly', '');
                ta.style.position = 'fixed';
                ta.style.top = '0';
                ta.style.left = '0';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.focus();
                ta.select();
                ta.setSelectionRange(0, text.length);
                const ok = document.execCommand('copy');
                document.body.removeChild(ta);
                if (!ok) throw new Error('execCommand("copy") returned false');
                flash('copied');
            } catch (err) {
                console.error('Copy failed:', err);
                btn.title = 'Copy failed: ' + err.message;
                flash('copy-failed');
            }
        }

        let errorTimer;
        function showError(message) {
            const banner = document.getElementById('error');
            banner.textContent = message;
            banner.hidden = false;
            clearTimeout(errorTimer);
            errorTimer = setTimeout(() => { banner.hidden = true; }, 10000);
        }

        // Every control goes through here. A refused operation comes back as
        // {"success": false} with a 200, so checking only the transport would
        // leave a failed click looking like it worked.
        async function command(path, description) {
            try {
                const res = await fetch(path, {method: 'POST'});
                const result = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(result.error || `HTTP ${res.status}`);
                if (result.success === false) throw new Error('the supervisor could not complete it; check its log');
                document.getElementById('error').hidden = true;
            } catch (err) {
                showError(`Could not ${description}: ${err.message}`);
            }
            loadStreams(true);
        }

        function startStream(name) {
            const loop = document.getElementById('loop').value;
            const mode = document.getElementById('mode').value;
            const gop = document.getElementById('gop').value;
            return command(`/api/streams/${name}/start?loop=${loop}&mode=${mode}&gop=${gop}`, `start ${name}`);
        }

        // Changing a setting on a running stream applies it right away by
        // restarting with the new values. On a stopped stream the choice
        // simply waits for Start, so browsing the options starts nothing.
        function settingChanged(name, running) {
            if (running) startStream(name);
        }

        function stopStream(name) { return command(`/api/streams/${name}/stop`, `stop ${name}`); }
        function stopAll() { return command('/api/streams/stop-all', 'stop all streams'); }
        function startAll() { return command('/api/streams/start-all', 'start all streams'); }
        function startOutput(name, output) { return command(`/api/streams/${name}/outputs/${output}/start`, `start ${name}/${output}`); }
        function stopOutput(name, output) { return command(`/api/streams/${name}/outputs/${output}/stop`, `stop ${name}/${output}`); }

        loadStreams();
        setInterval(loadStreams, 5000);
    </script>
</body>
</html>
