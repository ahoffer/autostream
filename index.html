<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Stream Control</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { box-sizing: border-box; }
        /* zoom scales every component (text, buttons, spacing) together. */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
               max-width: 900px; margin: 0 auto; padding: 20px; background: #1a1a2e; color: #eee;
               zoom: 0.8; }
        h1 { color: #00d4ff; }
        .stream { background: #16213e; border-radius: 8px; padding: 15px; margin: 10px 0;
                  display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
        .stream-name { font-weight: bold; font-size: 1.1em; flex: 1; min-width: 150px; }
        .stream-status { padding: 4px 12px; border-radius: 12px; font-size: 1.275em; }
        .running { background: #00c853; color: #000; }
        .stopped { background: #ff5252; color: #fff; }
        .waiting { background: #ffb74d; color: #000; }
        .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        button { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer;
                 font-size: 1.35em; transition: opacity 0.2s; }
        button:hover { opacity: 0.8; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-start { background: #00c853; color: #000; }
        .btn-stop { background: #ff5252; color: #fff; }
        .btn-plain { background: #0f3460; color: #fff; border: 1px solid #00d4ff; }
        select, input[type=number] { padding: 8px; border-radius: 4px; background: #0f3460; color: #fff; border: 1px solid #00d4ff; }
        input[type=number] { width: 5em; }
        .gop-label { color: #aaa; font-size: 0.95em; }
        .urls { width: 100%; margin-top: 5px; display: flex; flex-direction: column; gap: 3px; }
        .url-row { display: flex; align-items: center; gap: 6px; font-size: 1.2em; color: #888; }
        .url-label { color: #00d4ff; font-weight: bold; min-width: 54px; }
        .url-text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
        .copy-btn { background: transparent; border: none; color: #888; cursor: pointer; padding: 2px 4px;
                    border-radius: 3px; display: inline-flex; align-items: center; }
        .copy-btn:hover { color: #00d4ff; background: rgba(0, 212, 255, 0.1); }
        .copy-btn.copied { color: #00c853; }
        .copy-btn.copy-failed { color: #ff5252; }
        .copy-btn svg { width: 21px; height: 21px; }
        .url-row.inactive .url-text { opacity: 0.45; text-decoration: line-through; }
        .reason { color: #ffb74d; font-style: italic; }
        .outputs { width: 100%; display: flex; flex-direction: column; gap: 6px; margin-top: 8px;
                   border-top: 1px solid #0f3460; padding-top: 8px; }
        .output-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 1.1em; }
        .output-label { color: #00d4ff; font-weight: bold; min-width: 54px; }
        .output-status { padding: 2px 10px; border-radius: 10px; font-size: 0.95em; }
        .output-row button { font-size: 1em; padding: 5px 12px; }
        .command { width: 100%; margin: 0; padding: 8px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                   font-size: 0.9em; background: #0f3460; color: #ccc; border-radius: 4px;
                   white-space: pre-wrap; word-break: break-all; }
        .error-banner { background: #4a1e1e; border: 1px solid #ff5252; color: #ffb4b4;
                        border-radius: 4px; padding: 10px 12px; margin-bottom: 15px; font-size: 1.35em; }
    </style>
</head>
<body>
    <h1>Stream Control</h1>
    <div style="margin-bottom: 15px;">
        <button class="btn-stop" onclick="stopAll()">Stop All</button>
        <button class="btn-start" onclick="startAll()">Start All</button>
    </div>
    <!-- Below the controls so showing it never shifts the buttons under the cursor. -->
    <div id="error" class="error-banner" hidden></div>
    <div id="streams"></div>
    <script>
        const copyIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`;

        // "stream/output" keys of the command views that are open, so the
        // poll's rewrite reproduces them.
        const openCommands = new Set();
        let lastPayload = '';

        function escapeHtml(text) {
            return String(text).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
        }

        function urlRow(label, url, active, reason, title) {
            return `<div class="url-row${active ? '' : ' inactive'}">
                <span class="url-label" title="${title}">${label}</span>
                <span class="url-text">${url ?? 'none assigned'}</span>
                ${active
                    ? `<button class="copy-btn" title="Copy ${label} URL" onclick='copyUrl(this, ${JSON.stringify(url)})'>${copyIcon}</button>`
                    : `<span class="reason">inactive${reason ? ' — ' + reason : ''}</span>`}
            </div>`;
        }

        function outputRow(streamName, outputName, output) {
            const key = `${streamName}/${outputName}`;
            const status = output.running ? ['running', 'Running']
                         : output.enabled ? ['waiting', 'Waiting']
                         : ['stopped', 'Stopped'];
            return `<div class="output-row">
                <span class="output-label">${outputName.toUpperCase()}</span>
                <span class="output-status ${status[0]}">${status[1]}</span>
                ${output.reason && output.enabled ? `<span class="reason">${escapeHtml(output.reason)}</span>` : ''}
                <button class="btn-stop" onclick="stopOutput('${streamName}', '${outputName}')" ${output.enabled ? '' : 'disabled'}>Stop</button>
                <button class="btn-start" onclick="startOutput('${streamName}', '${outputName}')" title="Start, or restart if running">Start</button>
                <button class="btn-plain" onclick="toggleCommand('${key}')" ${output.command === null ? 'disabled' : ''} title="Show the ffmpeg command line">Command</button>
                ${openCommands.has(key) ? `<pre class="command">${escapeHtml(output.command)}</pre>` : ''}
            </div>`;
        }

        function streamCard(s) {
            return `
                <div class="stream">
                    <span class="stream-name">${s.name}</span>
                    <span class="stream-status ${s.running ? 'running' : 'stopped'}">
                        ${s.running ? 'Running' : 'Stopped'}
                    </span>
                    <div class="controls">
                        <select id="mode-${s.name}" onchange="settingChanged('${s.name}', ${s.running})" title="Video passthrough sends the source unmodified (H.264/H.265 only); changing it restarts a running stream">
                            <option value="passthrough" ${s.mode === 'passthrough' ? 'selected' : ''}>Video: Passthrough</option>
                            <option value="transcode" ${s.mode === 'transcode' ? 'selected' : ''}>Video: Transcode</option>
                        </select>
                        <select id="loop-${s.name}" onchange="settingChanged('${s.name}', ${s.running})">
                            <option value="-1" ${s.loop_count === -1 ? 'selected' : ''}>Loop: Infinite</option>
                            <option value="0" ${s.loop_count === 0 ? 'selected' : ''}>Play: 1x</option>
                            <option value="1" ${s.loop_count === 1 ? 'selected' : ''}>Play: 2x</option>
                            <option value="2" ${s.loop_count === 2 ? 'selected' : ''}>Play: 3x</option>
                            <option value="4" ${s.loop_count === 4 ? 'selected' : ''}>Play: 5x</option>
                            <option value="9" ${s.loop_count === 9 ? 'selected' : ''}>Play: 10x</option>
                        </select>
                        <label class="gop-label" title="Keyframe interval in frames (transcode only); changing it restarts a running stream">GOP
                            <input type="number" id="gop-${s.name}" min="1" step="1" value="${s.gop_frames}" onchange="settingChanged('${s.name}', ${s.running})">
                        </label>
                        <button class="btn-stop" onclick="stopStream('${s.name}')" ${!s.running ? 'disabled' : ''}>Stop</button>
                        <button class="btn-start" onclick="startStream('${s.name}')" ${s.running ? 'disabled' : ''}>Start</button>
                    </div>
                    <div class="urls">
                        ${urlRow('RTSP', s.rtsp_url, s.outputs.rtsp.running, s.outputs.rtsp.reason, 'RTSP through MediaMTX')}
                        ${urlRow('HLS', s.hls_url, s.outputs.rtsp.running, s.outputs.rtsp.reason, 'HLS is MediaMTX re-serving the RTSP output, so it is up whenever RTSP is')}
                        ${urlRow('UDP', s.udp_url, s.outputs.udp.running, s.outputs.udp.reason, 'MPEG-TS/UDP feed that preserves KLV metadata')}
                        ${s.mode === 'passthrough' && !s.passthrough_active
                            ? `<div class="url-row inactive">
                                <span class="url-label" title="Requested passthrough is not in effect">MODE</span>
                                <span class="reason">transcoding${s.passthrough_reason ? ' — ' + s.passthrough_reason : ''}</span>
                            </div>`
                            : ''}
                    </div>
                    <div class="outputs">
                        ${outputRow(s.name, 'rtsp', s.outputs.rtsp)}
                        ${outputRow(s.name, 'udp', s.outputs.udp)}
                    </div>
                </div>`;
        }

        async function loadStreams(force) {
            const container = document.getElementById('streams');
            // Never rewrite the page while a value is being typed: the caret
            // would be lost. The next poll after blur catches up.
            if (!force && document.activeElement && document.activeElement.tagName === 'INPUT') return;
            try {
                const res = await fetch('/api/streams');
                const payload = await res.text();
                // Skip the rewrite when nothing changed: no flicker, and an
                // unsubmitted selection survives the 5s poll.
                if (!force && payload === lastPayload) return;
                lastPayload = payload;
                const streams = JSON.parse(payload);
                container.innerHTML = streams.length ? streams.map(streamCard).join('') : '<p>No streams found</p>';
            } catch (err) {
                container.innerHTML = '<p style="color:#ff5252">Error loading streams: ' + err.message + '</p>';
            }
        }

        async function copyUrl(btn, text) {
            const flash = (cls) => {
                btn.classList.add(cls);
                setTimeout(() => btn.classList.remove(cls), 1000);
            };
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                    flash('copied');
                    return;
                }
                // Fallback for plain-HTTP origins where the Clipboard API is unavailable.
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.setAttribute('readonly', '');
                ta.style.position = 'fixed';
                ta.style.top = '0';
                ta.style.left = '0';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.focus();
                ta.select();
                ta.setSelectionRange(0, text.length);
                const ok = document.execCommand('copy');
                document.body.removeChild(ta);
                if (!ok) throw new Error('execCommand("copy") returned false');
                flash('copied');
            } catch (err) {
                console.error('Copy failed:', err);
                btn.title = 'Copy failed: ' + err.message;
                flash('copy-failed');
            }
        }

        let errorTimer;
        function showError(message) {
            const banner = document.getElementById('error');
            banner.textContent = message;
            banner.hidden = false;
            clearTimeout(errorTimer);
            errorTimer = setTimeout(() => { banner.hidden = true; }, 10000);
        }

        // Every control goes through here. A refused operation comes back as
        // {"success": false} with a 200, so checking only the transport would
        // leave a failed click looking like it worked.
        async function command(path, description) {
            try {
                const res = await fetch(path, {method: 'POST'});
                const result = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(result.error || `HTTP ${res.status}`);
                if (result.success === false) throw new Error('the supervisor could not complete it; check its log');
                document.getElementById('error').hidden = true;
            } catch (err) {
                showError(`Could not ${description}: ${err.message}`);
            }
            loadStreams(true);
        }

        function startStream(name) {
            const loopCount = document.getElementById('loop-' + name).value;
            const mode = document.getElementById('mode-' + name).value;
            const gop = document.getElementById('gop-' + name).value;
            return command(`/api/streams/${name}/start?loop=${loopCount}&mode=${mode}&gop=${gop}`, `start ${name}`);
        }

        // Changing a setting on a running stream applies it right away by
        // restarting with the new values. On a stopped stream the choice
        // simply waits for Start, so browsing the options starts nothing.
        function settingChanged(name, running) {
            if (running) startStream(name);
        }

        function stopStream(name) {
            return command(`/api/streams/${name}/stop`, `stop ${name}`);
        }

        function stopAll() {
            return command('/api/streams/stop-all', 'stop all streams');
        }

        function startAll() {
            return command('/api/streams/start-all', 'start all streams');
        }

        function startOutput(name, output) {
            return command(`/api/streams/${name}/outputs/${output}/start`, `start ${name}/${output}`);
        }

        function stopOutput(name, output) {
            return command(`/api/streams/${name}/outputs/${output}/stop`, `stop ${name}/${output}`);
        }

        function toggleCommand(key) {
            if (openCommands.has(key)) openCommands.delete(key); else openCommands.add(key);
            loadStreams(true);
        }

        loadStreams();
        setInterval(loadStreams, 5000);
    </script>
</body>
</html>
