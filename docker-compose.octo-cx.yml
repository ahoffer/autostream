# Consumer network: for a publisher on the same host as the Compose form of
# the consumer. Joins its octo-cx-network so containers there reach this one
# by name on its own ports, so no stream port is published on the host and
# none can clash with the consumer's. Only the two pages are published, for
# browsers outside Docker.
services:
  autostream:
    # Consumers on the network reach this container by name, so advertised URLs
    # use it unless Settings names another advertised host.
    environment:
      AUTOSTREAM_DEFAULT_HOST: ${CONTAINER_NAME}
    ports:
      - "${PLAY_PORT}:${PLAY_PORT}"                        # Play page
      - "${STREAM_API_PORT}:${STREAM_API_PORT}"            # Stream Control UI
    networks:
      - octo-cx-network

networks:
  octo-cx-network:
    external: true
