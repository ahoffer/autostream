services:
  autostream:
    image: ${CONTAINER_NAME}:${VERSION}
    volumes:
      - ./videos:/app/videos:ro
      - ./mounted:/app/mounted
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    # Bound runaway ffmpeg allocations to this container; equal limits disable swap.
    mem_limit: 6g
    memswap_limit: 6g
    stop_grace_period: 1s
    # Pass application settings through whole rather than restating each key.
    env_file:
      - .env
    # Detected on the host by make up; optional when running Compose directly.
    environment:
      AUTOSTREAM_HOSTNAME: ${AUTOSTREAM_HOSTNAME:-}
      AUTOSTREAM_LAN_IP: ${AUTOSTREAM_LAN_IP:-}
    # Networking comes from the second file named in COMPOSE_FILE (.env):
    # docker-compose.host.yml or docker-compose.octo-cx.yml.
