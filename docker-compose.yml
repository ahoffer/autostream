services:
  autostream:
    image: ${CONTAINER_NAME}:${VERSION}
    volumes:
      - ./videos:/app/videos:ro
      - ./mounted:/app/mounted
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    # Bound runaway ffmpeg allocations to this container; equal limits disable swap.
    mem_limit: 6g
    memswap_limit: 6g
    # The supervisor gives each ffmpeg five seconds to exit on SIGTERM and five
    # more after SIGKILL before it gives up, so let that cleanup finish.
    stop_grace_period: 15s
    # Pass application settings through whole rather than restating each key.
    env_file:
      - .env
    # Detected on the host by make run-host-mode; optional when running Compose directly.
    environment:
      AUTOSTREAM_HOSTNAME: ${AUTOSTREAM_HOSTNAME:-}
      AUTOSTREAM_LAN_IP: ${AUTOSTREAM_LAN_IP:-}
    # The make start targets add the networking file, docker-compose.host.yml
    # or docker-compose.octo-cx.yml, through COMPOSE_FILE.
